<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- simple inline SVG favicon to avoid 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halloween Watchlist Gacha</title>
    <link rel="stylesheet" href="style.css">
  </head>

<body>
    <div id="app">
    <div id="debug-window"><h4>Failed TMDB Fetches</h4></div>

    <!-- Pinned Top Action Bar -->
    <header id="top-bar">
      <div id="top-bar-left">
        <button id="suggestions-btn" title="Suggestions">🧁</button>
      </div>

      <div id="top-bar-center">
        <span id="search-icon">🔍</span>
        <input type="text" id="movie-search-input" placeholder="Search movies...">
      </div>

      <div id="top-bar-right">
        <img src="filter-icon.png" id="filter-icon" alt="Filter" title="Filters">
      </div>
    </header>

    <div id="search-menu" style="display: none;">
      <input type="text" id="movie-search-input" placeholder="Search movies...">
    </div>

    <div id="filter-menu">
        <div class="filter-group">
            <label>Decade</label>
            <select id="filter-decade">
                <option value="all">All Decades</option>
                <option value="1920">1920s</option>
                <option value="1930">1930s</option>
                <option value="1940">1940s</option>
                <option value="1950">1950s</option>
                <option value="1960">1960s</option>
                <option value="1970">1970s</option>
                <option value="1980">1980s</option>
                <option value="1990">1990s</option>
                <option value="2000">2000s</option>
                <option value="2010">2010s</option>
                <option value="2020">2020s</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Genres</label>
            <div id="genre-container" class="genre-list"></div>
        </div>
        <label style="display: flex; align-items: center; cursor: pointer; margin-bottom: 8px;">
          <input type="checkbox" id="filter-favorites" style="margin-right: 8px;"> 
          Favorites ⭐
        </label>
        <label style="display: flex; align-items: center; cursor: pointer; margin-bottom: 8px;">
          <input type="checkbox" id="filter-suggestions" style="margin-right: 8px;"> 
          Suggestions 🧁
        </label>
        <!--<label style="display: flex; align-items: center; cursor: pointer;">
          <input type="checkbox" id="filter-failed-images" style="margin-right: 8px;"> 
          Debug: Failed Images
        </label>-->
        <button id="apply-filters">Apply</button>
        <button id="clear-filters" style="width: 100%; background-color: transparent; border: 1px solid #666; margin-top: 8px; font-size: 0.8em;">Clear Filters</button>
    </div>

    <h1>Halloween Watch-a</h1>
    <p>Click to pick a random movie from the deck!</p>
    <button id="pull">Pick a Flick</button>
    <br /><br />
    <div id="pulled-card-wrapper">
      <button id="history-prev" style="display: none;">&lt;</button>
      <div id="pulled-card"></div>
      <button id="history-next" style="display: none;">&gt;</button>
    </div>

    <br />
    <button id="open-bracket-btn" style="display: none; margin: 15px auto;">Rank Picks</button>
    <div id="bracket-modal" class="modal">
      <div class="modal-content">
        <span id="close-bracket" class="close-btn">&times;</span>
        <div id="bracket-body">
          <h2 id="bracket-title">Movie Matchup</h2>
          <p id="bracket-progress">Match 1 of 1</p>
          <div id="matchup-container">
            <div id="card-choice-a" class="matchup-card"></div>
            <div class="vs-divider">VS</div>
            <div id="card-choice-b" class="matchup-card"></div>
          </div>
          <div id="live-rankings-container" style="margin-top: 20px; border-top: 1px solid #404040; padding-top: 15px;">
            <h3>Current Standings</h3>
            <ol id="live-rankings-list" class="ranked-list" style="margin: 10px auto; max-height: 150px; overflow-y: auto;"></ol>
          </div>
        </div>
      </div>
    </div>
    <br />
    <div id="suggestions-genres-banner" style="display: none; margin: 10px auto; font-size: 0.9em; color: #ffca28;"></div>
    <button id="load-more-suggestions-btn" style="display: none; margin: 10px auto; padding: 8px 16px; background-color: #ff6600; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Show more suggestions...</button>
    <br />
    <details>
      <summary id="cards-summary">All Cards</summary>
      <div id="all-cards-container">
      <div id="cards"></div>
      <div id="custom-scrubber-track">
        <div id="custom-scrubber-handle"></div>
      </div>
    </div>
    </details>
  </div>

<script>
// Debug toggle - set to false to hide the debug window
const debug = false;

// TMDB API key - get your free key from https://www.themoviedb.org/settings/api
const TMDB_API_KEY = '21380f8de344d7182c72f7be9d4b887e';

// for comparison rankings
const BASE_ELO = 1000;

let allCards = [];
let filteredCards = [];

let suggestionOffset = 10; // Initial limit set to 10
let allSuggestedCandidates = [];

// Call this when suggestions filter/checkbox is activated or favorites change
function resetSuggestionOffset() {
  suggestionOffset = 10;
}

// #region Favorites Management
function getFavorites() {
  return JSON.parse(localStorage.getItem('favoriteMovies') || '[]');
}

function saveFavorites(favorites) {
  localStorage.setItem('favoriteMovies', JSON.stringify(favorites));
}

function getCardKey(name, year) {
  return `${name} (${year})`;
}

function toggleFavorite(cardName, cardYear) {
  const cardKey = getCardKey(cardName, cardYear);
  let favorites = getFavorites();

  if (favorites.includes(cardKey)) {
    favorites = favorites.filter(key => key !== cardKey);
  } else {
    favorites.push(cardKey);
  }
  saveFavorites(favorites);
  
  // Update star buttons on all instances matching this unique key
  document.querySelectorAll(`.card[data-key="${CSS.escape(cardKey)}"] .star-btn`).forEach(btn => {
    btn.classList.toggle('active', favorites.includes(cardKey));
  });
}
// #endregion Favorites Management

// Function to update card image in DOM
function updateCardImage(card) {
  const cardKey = getCardKey(card.name, card.year);
  const cardDivs = document.querySelectorAll(`.card[data-key="${CSS.escape(cardKey)}"]`);
  
  cardDivs.forEach(div => {
    const img = div.querySelector('img');
    if (img) {
      img.src = card.image;
    }
  });
}

// Function to add links for image and title once we know the TMDB id
function updateCardLinks(card) {
  if (!card.id) return;
  const cardKey = getCardKey(card.name, card.year);
  const cardDiv = document.querySelector(`.card[data-key="${CSS.escape(cardKey)}"]`);
  if (!cardDiv) return;

  const img = cardDiv.querySelector('img');
  if (img) {
    let imgAnchor = img.closest('a');
    if (!imgAnchor) {
      imgAnchor = document.createElement('a');
      img.parentNode.insertBefore(imgAnchor, img);
      imgAnchor.appendChild(img);
    }
    imgAnchor.href = `https://www.themoviedb.org/${card.isTV ? 'tv' : 'movie'}/${card.id}`;
    imgAnchor.target = '_blank';
    imgAnchor.className = 'card-link';
  }

  const titleLink = cardDiv.querySelector('h3 a');
  if (titleLink) {
    titleLink.href = `https://www.themoviedb.org/${card.isTV ? 'tv' : 'movie'}/${card.id}`;
  }
}

// Function to fetch image for a card
async function fetchImage(card, triedWithYear = true) {
  try {
    let searchQuery = card.name;
    let isTV = false;

    if (searchQuery.includes(' (TV)')) {
      searchQuery = searchQuery.replace(' (TV)', '').trim();
      isTV = true;
    }
    if (card.ageRating.includes('TV') || card.genres.toLowerCase().includes('series') ||
      (card.genres.toLowerCase().includes('tv') && !card.genres.toLowerCase().includes('movie'))) {
      isTV = true;
    }

    const query = encodeURIComponent(searchQuery);
    // Use year only if triedWithYear is true and a year exists
    const yearParam = (triedWithYear && card.year) ? card.year : null;
    let url, res, data, poster = null;

    if (isTV) {
      url = `https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${query}` +
            (yearParam ? `&first_air_date_year=${yearParam}` : '');
      res = await fetch(url);
      data = await res.json();
      if (data.results && data.results.length > 0) {
        poster = data.results[0].poster_path;
        card.id = data.results[0].id;
        card.isTV = true;
      }
    } else {
      url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${query}` +
            (yearParam ? `&year=${yearParam}` : '');
      res = await fetch(url);
      data = await res.json();
      
      if (data.results && data.results.length > 0) {
        poster = data.results[0].poster_path;
        card.id = data.results[0].id;
        card.isTV = false;
      } else {
        // Fallback to TV search
        url = `https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${query}` +
              (yearParam ? `&first_air_date_year=${yearParam}` : '');
        res = await fetch(url);
        data = await res.json();
        if (data.results && data.results.length > 0) {
          poster = data.results[0].poster_path;
          card.id = data.results[0].id;
          card.isTV = true;
        }
      }
    }

    // FALLBACK: If no poster found with year, retry once without the year constraint
    if (!poster && triedWithYear && card.year) {
      console.log(`No match for ${card.name} (${card.year}). Retrying without year...`);
      return fetchImage(card, false);
    }

    if (poster) {
      card.image = `https://image.tmdb.org/t/p/w200/${poster}`;
      card.fetchFailed = false; // Mark as successful
      updateCardImage(card);
      updateCardLinks(card);
    } else {
      card.fetchFailed = true;
      
      if (debug && !triedWithYear) {
        // Only log to debug window if even the title-only search failed
        const linkHtml = card.name;
        document.getElementById('debug-window').innerHTML += `<p>Failed (All attempts): ${linkHtml}</p>`;
      }
    }
  } catch (e) {
    card.fetchFailed = true;
    console.error('Error fetching image for', card.name, e);
  }
}

// #region Intersection Observer Setup
let imageObserver = null;

function setupImageObserver() {
  // Observe cards relative to the scrollable #cards container
  const container = document.getElementById('cards');

  imageObserver = new IntersectionObserver((entries, observer) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const cardDiv = entry.target;
        const cardKey = cardDiv.getAttribute('data-key');
        
        // Find matching card object
        const card = allCards.find(c => getCardKey(c.name, c.year) === cardKey);
        
        if (card && card.image === 'default.webp' && !card.isFetching) {
          card.isFetching = true; // Guard against duplicate fetches
          fetchImage(card);
        }

        // Stop watching this card once triggered
        observer.unobserve(cardDiv);
      }
    });
  }, {
    root: container,
    rootMargin: '100px', // Preload images 100px before they scroll into view
    threshold: 0.1
  });
}

function observeVisibleCards() {
  if (!imageObserver) setupImageObserver();
  
  // Attach observer to all rendered card elements
  document.querySelectorAll('#cards .card').forEach(cardEl => {
    imageObserver.observe(cardEl);
  });
}
// #endregion - Intersection Observer Setup

// Function to load cards from Google Sheets CSV
async function loadCards() {
  const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS6hB593EeMhDH09J7d2NCTX3C1yZ3w1M9JfuONdcwxBPqmg1ThG1CxevHRuvzYk6YKfvVHsvYVh3ed/pub?gid=0&single=true&output=csv';
  const response = await fetch(url);
  const csvText = await response.text();
  const lines = csvText.split('\n');
  const headers = lines[0].split(',');
  const cards = [];

  for (let i = 1; i < lines.length; i++) {
    // Regex to split by comma but ignore commas inside double quotes
    const values = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
    
    if (values.length >= 7) {
      const card = {
        // Remove wrapping quotes and trailing years from the title
        name: values[2].replace(/^"|"$/g, '').replace(/ \(\d{4}\)$/, '').trim(), 
        ageRating: values[4].replace(/^"|"$/g, '').trim(),
        year: values[5].replace(/^"|"$/g, '').trim(),
        // Keep internal commas but remove wrapping quotes
        genres: values[6].replace(/^"|"$/g, '').trim(), 
        image: 'default.webp', //image: 'https://via.placeholder.com/150',
        id: null,
        isTV: false,
        fetchFailed: false
      };
      if (card.name) {
        cards.push(card);
      }
    }
  }
  return cards;
}

// Setup genres for filtering
function populateGenres(cards) {
  const genres = new Set();
  cards.forEach(c => {
    c.genres.split(',').forEach(g => genres.add(g.trim()));
  });
  
  const container = document.getElementById('genre-container');
  Array.from(genres).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' })).forEach(genre => {
    if(!genre) return;
    const div = document.createElement('div');
    div.className = 'genre-item';
    div.innerHTML = `<input type="checkbox" value="${genre}" class="genre-checkbox"> ${genre}`;
    container.appendChild(div);
  });
}

// Function to get CSS class based on age rating
function getClass(ageRating) {
  switch (ageRating) {
    case 'G': return 'common';
    case 'PG': return 'uncommon';
    case 'TV-Y7': return 'uncommon';
    case 'PG-13': return 'rare';
    case 'TV-14': return 'rare';
    case 'TV-MA': return 'epic';
    case 'R': return 'epic';
    case 'NR': return 'unique';
    default: return '';
  }
}

// Function to display cards
// #region DISPLAY CARDS
function displayCards(cards) {
  const cardsContainer = document.getElementById('cards');
  const favorites = getFavorites();

  cardsContainer.innerHTML = cards.map(card => {
    const cardKey = getCardKey(card.name, card.year);
    const isFav = favorites.includes(cardKey);
    const safeName = card.name.replace(/'/g, "\\'");
    const safeYear = card.year.replace(/'/g, "\\'");

    return `
      <div class="card ${getClass(card.ageRating)}" data-key="${cardKey}">
        <button class="star-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${safeName}', '${safeYear}')">★</button>
        <img src="${card.image}" alt="${card.name}" onerror="this.onerror=null; this.src='default.webp';">
        <h3><a href="${card.id ? `https://www.themoviedb.org/${card.isTV ? 'tv' : 'movie'}/${card.id}` : `https://www.themoviedb.org/search?query=${encodeURIComponent(card.name)}`}" target="_blank" class="card-link">${card.name}</a></h3>
        <p>Age Rating: ${card.ageRating}</p>
        <p>Year: ${card.year}</p>
        <p>Genres: ${card.genres}</p>
      </div>
    `;
  }).join('');

  // Observe newly displayed cards
  observeVisibleCards();
}
// #endregion DISPLAY CARDS

// Load cards and set up interactions
loadCards().then(cards => {
  allCards = cards;
  filteredCards = cards;
  populateGenres(cards)

  // Display cards immediately with placeholder images
  displayCards(cards);

  // Start batch fetching images in the background
  //fetchImagesInBatches(cards, 5, 100);
  
  // Fetch images asynchronously in the background
  // Helper for introducing a delay
// #region FETCH IMAGE
  const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

  async function fetchImage(card, retries = 3) {
    try {
      let searchQuery = card.name;
      let isTV = false;

      if (searchQuery.includes(' (TV)')) {
        searchQuery = searchQuery.replace(' (TV)', '').trim();
        isTV = true;
      }
      if (card.ageRating.includes('TV') || card.genres.toLowerCase().includes('series') ||
        (card.genres.toLowerCase().includes('tv') && !card.genres.toLowerCase().includes('movie'))) {
        isTV = true;
      }

      const query = encodeURIComponent(searchQuery);
      const endpoint = isTV ? 'tv' : 'movie';
      
      // Step 1: Query WITHOUT any year constraints
      let url = `https://api.themoviedb.org/3/search/${endpoint}?api_key=${TMDB_API_KEY}&query=${query}`;
      let res = await fetch(url);

      if (res.status === 429 && retries > 0) {
        await sleep(1000);
        return fetchImage(card, retries - 1);
      }

      let data = await res.json();

      // Step 2: Fall back to TV endpoint if Movie returned nothing
      if ((!data.results || data.results.length === 0) && !isTV) {
        url = `https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${query}`;
        res = await fetch(url);
        data = await res.json();
        if (data.results && data.results.length > 0) {
          isTV = true;
        }
      }

      if (data.results && data.results.length > 0) {
        const targetYear = parseInt(card.year, 10);
        
        let bestMatch = data.results.find(item => {
          const releaseDate = item.release_date || item.first_air_date || '';
          const itemYear = parseInt(releaseDate.split('-')[0], 10);
          return itemYear === targetYear;
        });

        if (!bestMatch) {
          bestMatch = data.results[0];
        }

        if (bestMatch.poster_path) {
          card.image = `https://image.tmdb.org/t/p/w200${bestMatch.poster_path}`;
          card.id = bestMatch.id;
          card.isTV = isTV;
          card.fetchFailed = false;
          updateCardImage(card);
          updateCardLinks(card);
          return card.image; // Return the fetched image URL
        }
      }

      card.fetchFailed = true;
    } catch (e) {
      if (retries > 0) {
        await sleep(1000);
        return fetchImage(card, retries - 1);
      }
      card.fetchFailed = true;
      console.error('Error fetching image for', card.name, e);
    }
    return 'default.webp';
  }

  // Queue system to load cards in batches to prevent flooding TMDB
  async function fetchImagesInBatches(cards, batchSize = 5, delayMs = 200) {
    for (let i = 0; i < cards.length; i += batchSize) {
      const batch = cards.slice(i, i + batchSize);
      await Promise.all(batch.map(card => fetchImage(card)));
      await sleep(delayMs); // Pause slightly between batches
    }
  }
// #endregion - FETCH IMAGE

  // Enable debug window if toggled
  if (debug) {
    document.getElementById('debug-window').style.display = 'block';
  }

  // Filter Logic
  document.getElementById('filter-icon').onclick = () => {
    const menu = document.getElementById('filter-menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  };

  // Live Search Filter Logic
  const searchInput = document.getElementById('movie-search-input');
  
  searchInput.addEventListener('input', (e) => {
    const query = e.target.value.trim().toLowerCase();
  
    filteredCards = allCards.filter(card => 
      card.name.toLowerCase().includes(query)
    );
  
    displayCards(filteredCards);
  });

// #region Apply Filter Logic
  document.getElementById('apply-filters').onclick = () => {
    const decade = document.getElementById('filter-decade').value;
    const selectedGenres = Array.from(document.querySelectorAll('.genre-checkbox:checked')).map(cb => cb.value);
    
    const showOnlyFailed = document.getElementById('filter-failed-images')?.checked || false;
    const showFavorites = document.getElementById('filter-favorites')?.checked || false;
    const showSuggestions = document.getElementById('filter-suggestions')?.checked || false;
    
    const banner = document.getElementById('suggestions-genres-banner');
    const loadMoreBtn = document.getElementById('load-more-suggestions-btn');

    if (!showSuggestions) {
      if (banner) banner.style.display = 'none';
      if (loadMoreBtn) loadMoreBtn.style.display = 'none';
      suggestionOffset = 10; // Reset offset when suggestions filter is turned off
    }
    
    const favorites = getFavorites();
    const suggestedCards = showSuggestions ? getSuggestedCards() : [];
    const suggestedKeys = new Set(suggestedCards.map(c => getCardKey(c.name, c.year)));
  
    filteredCards = allCards.filter(card => {
      const cardKey = getCardKey(card.name, card.year);
  
      const year = parseInt(card.year, 10);
      const decadeMatch = (decade === 'all') || (year >= parseInt(decade, 10) && year <= parseInt(decade, 10) + 9);
      
      const movieGenres = card.genres ? card.genres.split(',').map(g => g.trim()) : [];
      const genreMatch = selectedGenres.length === 0 || selectedGenres.some(sg => movieGenres.includes(sg));
  
      const imageMatch = !showOnlyFailed || card.fetchFailed === true;
  
      let specialMatch = true;
      if (showFavorites || showSuggestions) {
        const isFavMatch = showFavorites && favorites.includes(cardKey);
        const isSuggMatch = showSuggestions && suggestedKeys.has(cardKey);
        specialMatch = isFavMatch || isSuggMatch;
      }
  
      return decadeMatch && genreMatch && imageMatch && specialMatch;
    });

    // Toggle summary text based on filter state
    const summaryElem = document.getElementById('cards-summary');
    if (summaryElem) {
      const isFiltered = (decade !== 'all') || 
                         (selectedGenres.length > 0) || 
                         showOnlyFailed || 
                         showFavorites || 
                         showSuggestions;
      
      summaryElem.innerText = isFiltered ? 'All Cards (filtered)' : 'All Cards';
    }
  
    displayCards(filteredCards);
    document.getElementById('filter-menu').style.display = 'none';
  };

  // Button handler to load 10 more suggestions at a time
  document.getElementById('load-more-suggestions-btn')?.addEventListener('click', () => {
    suggestionOffset += 10;
    document.getElementById('apply-filters').click();
  });

  document.getElementById('suggestions-btn')?.addEventListener('click', () => {
    const favorites = getFavorites();
    if (favorites.length === 0) {
      alert("Add a few movies to your Favorites ⭐ first so we can generate suggestions!");
      return;
    }
  
    const suggCB = document.getElementById('filter-suggestions');
    if (suggCB) suggCB.checked = true;
  
    suggestionOffset = 10; // Reset offset on fresh suggestions click
    document.getElementById('apply-filters').click();
  });
// #endregion  Apply Filter Logic

  // Clear Filter Logic
  document.getElementById('clear-filters').onclick = () => {
    document.getElementById('filter-decade').value = 'all';
    document.querySelectorAll('.genre-checkbox').forEach(cb => cb.checked = false);
    
    const failedCB = document.getElementById('filter-failed-images');
    if (failedCB) failedCB.checked = false;
    
    const favCB = document.getElementById('filter-favorites');
    if (favCB) favCB.checked = false;

    const suggCB = document.getElementById('filter-suggestions');
    if (suggCB) suggCB.checked = false;

    const banner = document.getElementById('suggestions-genres-banner');
    if (banner) banner.style.display = 'none';

    const loadMoreBtn = document.getElementById('load-more-suggestions-btn');
    if (loadMoreBtn) loadMoreBtn.style.display = 'none';
    
    suggestionOffset = 10;
  
    // Clear search input and menu
    //searchInput.value = '';

    // Reset summary text
    const summaryElem = document.getElementById('cards-summary');
    if (summaryElem) summaryElem.innerText = 'All Cards';

    filteredCards = allCards;
    displayCards(allCards);
    document.getElementById('filter-menu').style.display = 'none';
  };
  
// #region Pull card functionality
  let historyStack = [];
  let historyIndex = -1;

  function updateHistoryNavUI() {
    const prevBtn = document.getElementById('history-prev');
    const nextBtn = document.getElementById('history-next');

    if (prevBtn) {
      prevBtn.style.display = historyStack.length > 1 ? 'inline-block' : 'none';
      prevBtn.disabled = historyIndex <= 0;
    }
    if (nextBtn) {
      nextBtn.style.display = historyStack.length > 1 ? 'inline-block' : 'none';
      nextBtn.disabled = historyIndex >= historyStack.length - 1;
    }

    const bracketBtn = document.getElementById('open-bracket-btn');
    if (bracketBtn) {
      bracketBtn.style.display = historyStack.length > 1 ? 'block' : 'none';
    }
  }

  async function renderPulledCard(card) {
    const pulledContainer = document.getElementById('pulled-card');
    if (!pulledContainer || !card) return;

    const cardKey = getCardKey(card.name, card.year);
    const isFav = getFavorites().includes(cardKey);
    const safeName = card.name.replace(/'/g, "\\'");
    const safeYear = card.year.replace(/'/g, "\\'");

    const initialSrc = (card.image && card.image !== 'default.webp') 
      ? card.image 
      : 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

    pulledContainer.innerHTML = `
      <div class="card ${getClass(card.ageRating)}" data-key="${cardKey}">
        <button class="star-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${safeName}', '${safeYear}')">★</button>
        <img id="pulled-img" src="${initialSrc}" alt="${card.name.replace(/"/g, '&quot;')}" onerror="this.onerror=null; this.src='default.webp';">
        <h3><a href="${card.id ? `https://www.themoviedb.org/${card.isTV ? 'tv' : 'movie'}/${card.id}` : `https://www.themoviedb.org/search?query=${encodeURIComponent(card.name)}`}" target="_blank" class="card-link">${card.name}</a></h3>
        <p>Age Rating: ${card.ageRating}</p>
        <p>Year: ${card.year}</p>
        <p>Genres: ${card.genres}</p>
      </div>
    `;

    if (!card.image || card.image === 'default.webp') {
      const imgElement = document.getElementById('pulled-img');

      const fallbackTimer = setTimeout(() => {
        if (imgElement) imgElement.src = 'default.webp';
      }, 1000);

      const fetchedUrl = await fetchImage(card);
      clearTimeout(fallbackTimer);

      if (imgElement) {
        imgElement.src = fetchedUrl || 'default.webp';
      }
    }

    updateHistoryNavUI();
  }

  const pullButton = document.getElementById('pull');
  if (pullButton) {
    pullButton.addEventListener('click', () => {
      if (filteredCards.length === 0) {
        alert("No movies match your current filters!");
        return;
      }

      // Exclude the immediate previous pick to prevent back-to-back duplicates
      let availableCards = filteredCards;
      if (filteredCards.length > 1 && historyStack.length > 0) {
        const lastCard = historyStack[historyStack.length - 1];
        availableCards = filteredCards.filter(c => getCardKey(c.name, c.year) !== getCardKey(lastCard.name, lastCard.year));
      }

      const randomCard = availableCards[Math.floor(Math.random() * availableCards.length)];

      historyStack.push(randomCard);
      if (historyStack.length > 10) {
        historyStack.shift();
      }
      historyIndex = historyStack.length - 1;

      renderPulledCard(randomCard);
    });
  }

  document.getElementById('history-prev')?.addEventListener('click', () => {
    if (historyIndex > 0) {
      historyIndex--;
      renderPulledCard(historyStack[historyIndex]);
    }
  });

  document.getElementById('history-next')?.addEventListener('click', () => {
    if (historyIndex < historyStack.length - 1) {
      historyIndex++;
      renderPulledCard(historyStack[historyIndex]);
    }
  });
// #endregion

// Fisher-Yates shuffle helper to randomize ties/candidates so suggestions stay fresh
  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

// #region Suggestions Logic
  function getSuggestedCards() {
    const favorites = getFavorites();
    const banner = document.getElementById('suggestions-genres-banner');
    const loadMoreBtn = document.getElementById('load-more-suggestions-btn');

    if (favorites.length === 0) {
      if (banner) banner.style.display = 'none';
      if (loadMoreBtn) loadMoreBtn.style.display = 'none';
      allSuggestedCandidates = [];
      return [];
    }

    const favCards = allCards.filter(card => favorites.includes(getCardKey(card.name, card.year)));
    const genreCounts = {};

    favCards.forEach(card => {
      if (!card.genres) return;
      card.genres.split(',').forEach(g => {
        const genre = g.trim();
        if (genre) genreCounts[genre] = (genreCounts[genre] || 0) + 1;
      });
    });

    const topGenres = Object.keys(genreCounts).sort((a, b) => genreCounts[b] - genreCounts[a]);

    if (banner && topGenres.length > 0) {
      banner.innerText = `Suggestions based on favorite genres: ${topGenres.join(', ')}`;
      banner.style.display = 'block';
    }

    const candidates = allCards.filter(card => !favorites.includes(getCardKey(card.name, card.year)));

    const scoredCards = candidates.map(card => {
      let score = 0;
      if (card.genres) {
        card.genres.split(',').forEach(g => {
          const genre = g.trim();
          if (genreCounts[genre]) score += genreCounts[genre];
        });
      }
      return { card, score };
    }).filter(item => item.score > 0);

    // Group candidates by score, shuffle within each score tier, then flatten back into a list
    const groupedByScore = {};
    scoredCards.forEach(item => {
      if (!groupedByScore[item.score]) groupedByScore[item.score] = [];
      groupedByScore[item.score].push(item.card);
    });

    const sortedScores = Object.keys(groupedByScore).map(Number).sort((a, b) => b - a);
    
    allSuggestedCandidates = [];
    sortedScores.forEach(score => {
      const randomizedTier = shuffleArray(groupedByScore[score]);
      allSuggestedCandidates.push(...randomizedTier);
    });

    // Toggle "Show more suggestions..." button visibility based on remaining candidate pool
    if (loadMoreBtn) {
      loadMoreBtn.style.display = (allSuggestedCandidates.length > suggestionOffset) ? 'block' : 'none';
    }

    return allSuggestedCandidates.slice(0, suggestionOffset);
  }
// #endregion Suggestions Logic

// #region Comparison Bracket Logic
  let comparisons = [];
  let comparisonIndex = 0;
  let winCounts = {};

  function generatePairs(cards) {
    const pairs = [];
    for (let i = 0; i < cards.length; i++) {
      for (let j = i + 1; j < cards.length; j++) {
        pairs.push([cards[i], cards[j]]);
      }
    }
    // Shuffle comparison pairs
    return pairs.sort(() => Math.random() - 0.5);
  }

  function renderLiveRankings() {
    const rankingsList = document.getElementById('live-rankings-list');
    if (!rankingsList) return;
  
    const uniqueHistory = Array.from(
      new Map(historyStack.map(c => [getCardKey(c.name, c.year), c])).values()
    );
  
    const sorted = uniqueHistory.sort((a, b) => {
      const statsA = winCounts[getCardKey(a.name, a.year)] || { elo: BASE_ELO, picks: 0 };
      const statsB = winCounts[getCardKey(b.name, b.year)] || { elo: BASE_ELO, picks: 0 };
      return statsB.elo - statsA.elo;
    });
  
    rankingsList.innerHTML = sorted.map(card => {
      const stats = winCounts[getCardKey(card.name, card.year)] || { elo: BASE_ELO, picks: 0 };
      const pickLabel = stats.picks === 1 ? '1 pick' : `${stats.picks} picks`;
      return `<li><strong>${card.name}</strong> (${card.year}) — ${stats.elo} pts (${pickLabel})</li>`;
    }).join('');
  }
  
  function showRankedResults() {
    const bracketBody = document.getElementById('bracket-body');
    
    const uniqueHistory = Array.from(
      new Map(historyStack.map(c => [getCardKey(c.name, c.year), c])).values()
    );
  
    const ranked = uniqueHistory.sort((a, b) => {
      const statsA = winCounts[getCardKey(a.name, a.year)] || { elo: BASE_ELO, picks: 0 };
      const statsB = winCounts[getCardKey(b.name, b.year)] || { elo: BASE_ELO, picks: 0 };
      return statsB.elo - statsA.elo;
    });
  
    let html = `<h2>Final Elo Rankings</h2><ol class="ranked-list">`;
    ranked.forEach(card => {
      const stats = winCounts[getCardKey(card.name, card.year)] || { elo: BASE_ELO, picks: 0 };
      const pickLabel = stats.picks === 1 ? '1 pick' : `${stats.picks} picks`;
      html += `<li><strong>${card.name}</strong> (${card.year}) — ${stats.elo} pts (${pickLabel})</li>`;
    });
    html += `</ol><button id="restart-bracket" style="margin-top:15px;">Rank Again</button>`;
  
    bracketBody.innerHTML = html;
    document.getElementById('restart-bracket')?.addEventListener('click', startBracket);
  }

  function renderMatchupCard(card, elementId) {
    const container = document.getElementById(elementId);
    if (!container) return;
    const cardKey = getCardKey(card.name, card.year);
    
    container.innerHTML = `
      <div class="card ${getClass(card.ageRating)}" style="margin:0; width: 100%;">
        <img src="${card.image || 'default.webp'}" alt="${card.name}">
        <h3>${card.name}</h3>
        <p>${card.year} • ${card.ageRating}</p>
        <p>${card.genres}</p>
      </div>
    `;
    container.onclick = () => selectWinner(card);
  }

  function showNextMatchup() {
    if (comparisonIndex >= comparisons.length) {
      showRankedResults();
      return;
    }

    const [cardA, cardB] = comparisons[comparisonIndex];
    document.getElementById('bracket-progress').innerText = `Match ${comparisonIndex + 1} of ${comparisons.length}`;
    renderMatchupCard(cardA, 'card-choice-a');
    renderMatchupCard(cardB, 'card-choice-b');
    
    // Refresh live leaderboard
    renderLiveRankings();
  }

  function selectWinner(winnerCard) {
    const [cardA, cardB] = comparisons[comparisonIndex];
    const keyA = getCardKey(cardA.name, cardA.year);
    const keyB = getCardKey(cardB.name, cardB.year);
  
    // Fallback defaults if key missing
    const statsA = winCounts[keyA] || { elo: BASE_ELO, picks: 0 };
    const statsB = winCounts[keyB] || { elo: BASE_ELO, picks: 0 };
  
    const ratingA = statsA.elo;
    const ratingB = statsB.elo;

    // Scale factor reduced to 200 (makes point differentials produce much higher win probabilities)
    const SCALE = 200;
    const expectedA = 1 / (1 + Math.pow(10, (ratingB - ratingA) / SCALE));
    const expectedB = 1 / (1 + Math.pow(10, (ratingA - ratingB) / SCALE));
  
    const winnerKey = getCardKey(winnerCard.name, winnerCard.year);
    const actualA = winnerKey === keyA ? 1 : 0;
    const actualB = 1 - actualA;
  
    const K = 80;
  
    // Increment winning pick count
    if (winnerKey === keyA) statsA.picks += 1;
    if (winnerKey === keyB) statsB.picks += 1;
  
    // Update Elo ratings
    statsA.elo = Math.round(ratingA + K * (actualA - expectedA));
    statsB.elo = Math.round(ratingB + K * (actualB - expectedB));
  
    winCounts[keyA] = statsA;
    winCounts[keyB] = statsB;
  
    comparisonIndex++;
    showNextMatchup();
  }

  function startBracket() {
    const uniqueCards = Array.from(
      new Map(historyStack.map(c => [getCardKey(c.name, c.year), c])).values()
    );
  
    if (uniqueCards.length < 2) return;
  
    // Track Elo and pick counts per card key
    winCounts = {};
    uniqueCards.forEach(c => {
      winCounts[getCardKey(c.name, c.year)] = { elo: BASE_ELO, picks: 0 };
    });
  
    comparisons = generatePairs(uniqueCards);
    comparisonIndex = 0;
  
    document.getElementById('bracket-body').innerHTML = `
      <h2 id="bracket-title">Movie Matchup</h2>
      <p id="bracket-progress"></p>
      <div id="matchup-container">
        <div id="card-choice-a" class="matchup-card"></div>
        <div class="vs-divider">VS</div>
        <div id="card-choice-b" class="matchup-card"></div>
      </div>
      <div id="live-rankings-container" style="margin-top: 20px; border-top: 1px solid #404040; padding-top: 15px;">
        <h3>Current Standings</h3>
        <ol id="live-rankings-list" class="ranked-list" style="margin: 10px auto; max-height: 150px; overflow-y: auto;"></ol>
      </div>
    `;
  
    document.getElementById('bracket-modal').style.display = 'flex';
    showNextMatchup();
  }

    document.getElementById('open-bracket-btn')?.addEventListener('click', startBracket);
    document.getElementById('close-bracket')?.addEventListener('click', () => {
    document.getElementById('bracket-modal').style.display = 'none';
  });
// #endregion Comparison Bracket Logic

  // SCROLL BAR SCRUBBER LOGIC
  const cardsDiv = document.getElementById('cards');
  const track = document.getElementById('custom-scrubber-track');
  const handle = document.getElementById('custom-scrubber-handle');

  function handleScrub(e) {
    const rect = track.getBoundingClientRect();
    let percentage = (e.clientY - rect.top) / rect.height;
    percentage = Math.max(0, Math.min(1, percentage));

    // Scroll the internal div, not the window
    const scrollTarget = (cardsDiv.scrollHeight - cardsDiv.clientHeight) * percentage;
    cardsDiv.scrollTop = scrollTarget;
  }

  // Handle Dragging
  track.addEventListener('mousedown', (e) => {
    handleScrub(e);
    const onMouseMove = (move) => handleScrub(move);
    const onMouseUp = () => {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    };
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });

  // Update handle position when user scrolls the div normally
  cardsDiv.addEventListener('scroll', () => {
    const scrollPct = cardsDiv.scrollTop / (cardsDiv.scrollHeight - cardsDiv.clientHeight);
    const availableTrackSpace = track.clientHeight - handle.clientHeight;
    handle.style.top = (scrollPct * availableTrackSpace) + 'px';
  });
}).catch(e => console.error('Error loading cards:', e));
    </script>
  </body>
</html>
